name: preview

on:
  pull_request:
    types: [opened, reopened, synchronize]
    # Docs never reach a stage. Preview is not a required check, so a skipped run blocks no merge. If it becomes one,
    # move this skip into the job, because a required check waits forever on a workflow that never starts.
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

# A newer push cancels this run, even mid-deploy: Alchemy records each change before it makes it, and the next deploy
# of the stage finishes what was cut off. The job's deploy-pr group is separate, so destroys are never cancelled.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ALCHEMY_TELEMETRY_DISABLED: "1"
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

defaults:
  run:
    shell: bash

jobs:
  preview:
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 20
    concurrency:
      group: deploy-pr-${{ github.event.pull_request.number }}
      queue: max
    permissions:
      contents: read
      pull-requests: write
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup
      - run: |
          pr=$(gh pr view "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --json state,headRefOid --jq '.state + " " + .headRefOid')
          if [ "${pr% *}" != OPEN ]; then echo "Pull request is ${pr% *}, so $STAGE is left to the destroy job."; exit 0; fi
          if [ "${pr#* }" != "${{ github.event.pull_request.head.sha }}" ]; then echo "The head moved to ${pr#* }, so the run for that commit deploys $STAGE."; exit 0; fi
          # Cloudflare can take longer than Alchemy's own retries to find a Worker or queue it just created. Deploying again converges.
          if ! bun run --cwd infra deploy --stage "$STAGE" --yes; then
            echo "Deploying $STAGE failed, so it deploys once more in 30 seconds."
            sleep 30
            bun run --cwd infra deploy --stage "$STAGE" --yes
          fi
          bun scripts/stage-smoke.ts "$STAGE"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          STARGREP_GITHUB_TOKEN: ${{ secrets.STARGREP_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
