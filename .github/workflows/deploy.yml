name: deploy

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  # Temporary until this workflow is on main: GitHub runs pull_request_target only from the default branch's
  # workflow, and it is the only close event that fires for a pull request with merge conflicts.
  pull_request_target:
    types: [closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ALCHEMY_TELEMETRY_DISABLED: "1"
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  prod:
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-prod
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run --cwd infra deploy --config database.run.ts --stage shared --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      - run: bun run --cwd infra deploy --stage prod --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

  preview:
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-pr-${{ github.event.pull_request.number }}
      queue: max
    permissions:
      contents: read
      pull-requests: write
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup
      - id: deploy
        run: |
          state=$(gh pr view "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$state" != OPEN ]; then echo "Pull request is $state, so $STAGE is left to the destroy job."; exit 0; fi
          bun run --cwd infra deploy --stage "$STAGE" --yes
          echo deployed=true >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
      - if: steps.deploy.outputs.deployed == 'true'
        working-directory: infra
        run: |
          output=$(bunx alchemy state read "Stargrep/$STAGE/output" | sed -n '/^{/,$p')
          token=$(jq -r .debugToken.__redacted__ <<<"$output")
          echo "::add-mask::$token"
          DEBUG_TOKEN=$token bun ../scripts/stage-smoke.ts "$(jq -r .debugUrl <<<"$output")"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  destroy:
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-pr-${{ github.event.pull_request.number }}
      queue: max
    permissions:
      contents: read
      pull-requests: read
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The pull_request_target run checks out the default branch, so it runs no pull request code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      - uses: ./.github/actions/setup
      - run: |
          state=$(gh pr view "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$state" = OPEN ]; then echo "Pull request was reopened, so $STAGE stays."; exit 0; fi
          bun run --cwd infra destroy --stage "$STAGE" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

  prod-plan:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup
      - run: bun run --cwd infra deploy --stage prod --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

  store-refusal:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup
      - run: |
          sed -i 's/Cloudflare.state()/Cloudflare.state({ workerName: "stargrep-refusal-probe" })/' infra/state.ts
          grep -n "stargrep-refusal-probe" infra/state.ts
          if bun run --cwd infra deploy --stage refusal-probe --yes > refusal.log 2>&1; then
            cat refusal.log
            echo "deploy --yes succeeded, so it created or used the probe store"
            exit 1
          fi
          grep -nE "State Store|bootstrap|not found" refusal.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
