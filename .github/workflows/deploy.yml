name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ALCHEMY_TELEMETRY_DISABLED: "1"
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

defaults:
  run:
    shell: bash

jobs:
  prod:
    if: >-
      vars.CLOUDFLARE_ACCOUNT_ID != '' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    concurrency:
      group: deploy-prod
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: ./.github/actions/setup
      - name: Stop early when a pipeline or sign-in secret is missing
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "Prod needs AI_GATEWAY_API_KEY. The prod deploy would fail on it later."
            exit 1
          fi
          if [ "$STARGREP_GITHUB_SERVER_TOKEN" = pat ] && [ -z "$STARGREP_GITHUB_TOKEN" ]; then
            echo "STARGREP_GITHUB_SERVER_TOKEN is pat, so prod needs STARGREP_GITHUB_TOKEN. The prod deploy would fail on it later."
            exit 1
          fi
          if [ "$STARGREP_GITHUB_SERVER_TOKEN" = app ] && [ -z "$STARGREP_GITHUB_APP_PRIVATE_KEY" ]; then
            echo "STARGREP_GITHUB_SERVER_TOKEN is app, so prod needs STARGREP_GITHUB_APP_PRIVATE_KEY. The prod deploy would fail on it later."
            exit 1
          fi
          if [ -z "$STARGREP_GITHUB_APP_CLIENT_ID" ] || [ -z "$STARGREP_GITHUB_APP_CLIENT_SECRET" ] || [ -z "$BETTER_AUTH_SECRET" ] || [ -z "$AUTH_PROXY_SECRET" ]; then
            echo "Prod needs STARGREP_GITHUB_APP_CLIENT_ID, STARGREP_GITHUB_APP_CLIENT_SECRET, BETTER_AUTH_SECRET, and AUTH_PROXY_SECRET. The prod deploy would fail on them later."
            exit 1
          fi
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          STARGREP_GITHUB_SERVER_TOKEN: ${{ vars.STARGREP_GITHUB_SERVER_TOKEN || 'app' }}
          STARGREP_GITHUB_APP_PRIVATE_KEY: ${{ secrets.STARGREP_GITHUB_APP_PRIVATE_KEY }}
          STARGREP_GITHUB_TOKEN: ${{ secrets.STARGREP_GITHUB_TOKEN }}
          STARGREP_GITHUB_APP_CLIENT_ID: ${{ vars.STARGREP_GITHUB_APP_CLIENT_ID }}
          STARGREP_GITHUB_APP_CLIENT_SECRET: ${{ secrets.STARGREP_GITHUB_APP_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          AUTH_PROXY_SECRET: ${{ secrets.AUTH_PROXY_SECRET }}
      - id: deploy
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$DEPLOY_SHA&status=success" --jq '.workflow_runs | length')
            if [ "$passed" -eq 0 ]; then echo "CI has not passed for $DEPLOY_SHA on main."; exit 1; fi
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$DEPLOY_SHA" ]; then echo "main moved to $head, so the run for that commit deploys prod."; exit 0; fi
          bun run --cwd infra deploy --config database.run.ts --stage shared --yes
          bun run --cwd infra deploy --stage prod --yes
          echo "deployed=true" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          STARGREP_GITHUB_SERVER_TOKEN: ${{ vars.STARGREP_GITHUB_SERVER_TOKEN || 'app' }}
          STARGREP_GITHUB_APP_PRIVATE_KEY: ${{ secrets.STARGREP_GITHUB_APP_PRIVATE_KEY }}
          STARGREP_GITHUB_TOKEN: ${{ secrets.STARGREP_GITHUB_TOKEN }}
          STARGREP_GITHUB_APP_CLIENT_ID: ${{ vars.STARGREP_GITHUB_APP_CLIENT_ID }}
          STARGREP_GITHUB_APP_CLIENT_SECRET: ${{ secrets.STARGREP_GITHUB_APP_CLIENT_SECRET }}
          AUTH_PROXY_SECRET: ${{ secrets.AUTH_PROXY_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      - name: Check public production health and API
        if: steps.deploy.outputs.deployed == 'true'
        run: bun scripts/stage-smoke.ts --public https://stargrep.com
