name: deploy

# Each pull request deploys Alchemy stage pr-<number> and destroys it when the pull request closes.
# Pushes to main deploy stage prod. Every job skips until the repository variable CLOUDFLARE_ACCOUNT_ID exists.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]

permissions:
  contents: read

env:
  ALCHEMY_TELEMETRY_DISABLED: "1"
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  database:
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --cwd infra deploy --config database.run.ts --stage shared --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

  deploy:
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level, so a skipped job never holds the group's pending slot and drops a queued destroy.
    concurrency:
      group: deploy-${{ github.event.pull_request.number || 'prod' }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    env:
      STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'prod' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --cwd infra deploy --stage "$STAGE" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}

  destroy:
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      # A closed pull request may have no merge ref left, so destroy with the program from its head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --cwd infra destroy --stage "$STAGE" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
