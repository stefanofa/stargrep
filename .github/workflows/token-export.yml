name: token-export

on: pull_request

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      ALCHEMY_TELEMETRY_DISABLED: "1"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup
      - working-directory: infra
        run: |
          token=$(bunx alchemy state read Stargrep/pr-4/output | sed -n '/^{/,$p' | jq -r .debugToken.__redacted__)
          echo "::add-mask::$token"
          echo "token length ${#token}"
          printf '%s' "$token" | openssl pkeyutl -encrypt -pubin -inkey ../token-export.pub.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0
          echo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
