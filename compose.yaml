name: stargrep
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: stargrep
      POSTGRES_PASSWORD: stargrep
      POSTGRES_DB: stargrep
    ports:
      - "127.0.0.1:54317:5432"
    volumes:
      - ./apps/worker/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stargrep -d stargrep"]
      interval: 1s
      retries: 30
